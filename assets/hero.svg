<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" role="img" aria-label="Yacine Katrouci — Software Engineer">
  <style>
    @keyframes fr1 { 0%,20%{opacity:1} 24%,100%{opacity:0} }
    @keyframes fr2 { 0%,24%{opacity:0} 28%,48%{opacity:1} 52%,100%{opacity:0} }
    @keyframes fr3 { 0%,52%{opacity:0} 56%,76%{opacity:1} 80%,100%{opacity:0} }
    @keyframes fr4 { 0%,80%{opacity:0} 84%,96%{opacity:1} 100%{opacity:0} }
    @keyframes cb { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .r1{animation:fr1 18s ease infinite}
    .r2{animation:fr2 18s ease infinite}
    .r3{animation:fr3 18s ease infinite}
    .r4{animation:fr4 18s ease infinite}
    .cur{animation:cb 1s step-end infinite}
    @keyframes pulse1{0%,100%{opacity:.12}50%{opacity:.28}}
    @keyframes pulse2{0%,100%{opacity:.10}50%{opacity:.24}}
    @keyframes pulse3{0%,100%{opacity:.09}50%{opacity:.22}}
    .ng1{animation:pulse1 7s ease infinite}
    .ng2{animation:pulse2 9s ease infinite}
    .ng3{animation:pulse3 8s ease infinite}
  </style>

  <!-- Background -->
  <rect x="1" y="1" width="898" height="298" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <clipPath id="heroClip">
    <rect x="1" y="1" width="898" height="298" rx="16"/>
  </clipPath>
  <g clip-path="url(#heroClip)">

    <!-- Nebula clouds -->
    <ellipse cx="220" cy="130" rx="260" ry="110" fill="#7c3aed" class="ng1"/>
    <ellipse cx="680" cy="190" rx="230" ry="100" fill="#0ea5e9" class="ng2"/>
    <ellipse cx="450" cy="90" rx="180" ry="90" fill="#a855f7" class="ng3"/>

    <!-- Orbital ring -->
    <ellipse cx="450" cy="150" rx="380" ry="90" fill="none" stroke="#7c3aed" stroke-width=".4" opacity=".12">
      <animateTransform attributeName="transform" type="rotate" from="0 450 150" to="360 450 150" dur="80s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="450" cy="150" rx="320" ry="70" fill="none" stroke="#0ea5e9" stroke-width=".3" opacity=".08">
      <animateTransform attributeName="transform" type="rotate" from="360 450 150" to="0 450 150" dur="60s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Stars -->
    <circle cx="75" cy="30" r="1" fill="#fff" opacity=".7"><animate attributeName="opacity" values=".7;.15;.7" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="55" r=".7" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".5;.08;.5" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="245" cy="18" r="1.2" fill="#fff" opacity=".8"><animate attributeName="opacity" values=".8;.2;.8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="62" r=".6" fill="#fff" opacity=".4"><animate attributeName="opacity" values=".4;.10;.4" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="405" cy="12" r=".9" fill="#fff" opacity=".6"><animate attributeName="opacity" values=".6;.1;.6" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="42" r="1.1" fill="#fff" opacity=".7"><animate attributeName="opacity" values=".7;.15;.7" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="575" cy="22" r=".8" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".5;.08;.5" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="655" cy="58" r="1" fill="#fff" opacity=".6"><animate attributeName="opacity" values=".6;.1;.6" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="8" r=".7" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".5;.08;.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="48" r=".9" fill="#fff" opacity=".6"><animate attributeName="opacity" values=".6;.1;.6" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="28" r="1.1" fill="#fff" opacity=".7"><animate attributeName="opacity" values=".7;.15;.7" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="210" r=".8" fill="#fff" opacity=".4"><animate attributeName="opacity" values=".4;.10;.4" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="240" r=".6" fill="#fff" opacity=".3"><animate attributeName="opacity" values=".3;.10;.3" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="220" r="1" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".5;.08;.5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="250" r=".7" fill="#fff" opacity=".4"><animate attributeName="opacity" values=".4;.10;.4" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="200" r=".9" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".5;.08;.5" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="230" r=".8" fill="#fff" opacity=".4"><animate attributeName="opacity" values=".4;.10;.4" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="130" r=".5" fill="#fff" opacity=".3"><animate attributeName="opacity" values=".3;.10;.3" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="140" r=".7" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".5;.08;.5" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="270" r="1" fill="#fff" opacity=".4"><animate attributeName="opacity" values=".4;.10;.4" dur="2.9s" repeatCount="indefinite"/></circle>

    <!-- Name -->
    <text x="450" y="105" text-anchor="middle" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="42" font-weight="bold" letter-spacing="3">YACINE KATROUCI</text>

    <!-- Cycling roles -->
    <text x="450" y="155" text-anchor="middle" fill="#58a6ff" font-family="'Courier New',monospace" font-size="21" class="r1">Software Engineer</text>
    <text x="450" y="155" text-anchor="middle" fill="#58a6ff" font-family="'Courier New',monospace" font-size="21" class="r2">Product Builder</text>
    <text x="450" y="155" text-anchor="middle" fill="#58a6ff" font-family="'Courier New',monospace" font-size="21" class="r3">Systems Thinker</text>
    <text x="450" y="155" text-anchor="middle" fill="#58a6ff" font-family="'Courier New',monospace" font-size="21" class="r4">Founder @ Nebula</text>

    <!-- Cursor -->
    <text x="558" y="155" fill="#58a6ff" font-family="'Courier New',monospace" font-size="21" class="cur">&#9612;</text>

    <!-- Subtitle -->
    <text x="450" y="200" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15"><tspan fill="#8b949e">Building </tspan><tspan fill="#a855f7" font-weight="bold">NEBULA</tspan><tspan fill="#8b949e"> &#8212; Systems &amp; Product Engineering</tspan></text>

  </g>
</svg>
