<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" role="img" aria-label="Nebula ecosystem map">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreBody" cx="38%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b1d6e"/>
    </radialGradient>
    <clipPath id="sysClip">
      <rect x="1" y="1" width="798" height="448" rx="16"/>
    </clipPath>
  </defs>

  <!-- Card -->
  <rect x="1" y="1" width="798" height="448" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <g clip-path="url(#sysClip)">
    <!-- Nebula haze -->
    <ellipse cx="300" cy="180" rx="240" ry="110" fill="#7c3aed" opacity=".07"/>
    <ellipse cx="520" cy="230" rx="220" ry="100" fill="#0ea5e9" opacity=".06"/>

    <!-- Stars -->
    <circle cx="90" cy="90" r="1" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".5;.12;.5" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="330" r=".8" fill="#fff" opacity=".4"><animate attributeName="opacity" values=".4;.1;.4" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="80" r="1.1" fill="#fff" opacity=".6"><animate attributeName="opacity" values=".6;.15;.6" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="320" r=".8" fill="#fff" opacity=".4"><animate attributeName="opacity" values=".4;.1;.4" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="220" r=".7" fill="#fff" opacity=".35"><animate attributeName="opacity" values=".35;.08;.35" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="190" r=".9" fill="#fff" opacity=".5"><animate attributeName="opacity" values=".5;.12;.5" dur="3.1s" repeatCount="indefinite"/></circle>

    <!-- Title -->
    <text x="400" y="44" text-anchor="middle" fill="#8b949e" font-family="'Courier New',monospace" font-size="13" letter-spacing="4">NEBULA ECOSYSTEM</text>

    <!-- Orbit ring 1 (inner) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 400 205" to="360 400 205" dur="40s" repeatCount="indefinite"/>
      <circle cx="400" cy="205" r="75" fill="none" stroke="#7c3aed" stroke-opacity=".40" stroke-dasharray="4 7"/>
      <circle cx="475" cy="205" r="6" fill="#a855f7">
        <animate attributeName="r" values="6;7;6" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="475" cy="205" r="10" fill="none" stroke="#a855f7" stroke-opacity=".4">
        <animate attributeName="r" values="9;13;9" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".4;0;.4" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Orbit ring 2 (middle, reversed) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 400 205" to="0 400 205" dur="55s" repeatCount="indefinite"/>
      <circle cx="400" cy="205" r="115" fill="none" stroke="#0ea5e9" stroke-opacity=".32" stroke-dasharray="3 8"/>
      <circle cx="515" cy="205" r="6" fill="#0ea5e9"/>
      <circle cx="285" cy="205" r="3" fill="#e6edf3" opacity=".85"/>
    </g>

    <!-- Orbit ring 3 (outer) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 400 205" to="360 400 205" dur="70s" repeatCount="indefinite"/>
      <circle cx="400" cy="205" r="150" fill="none" stroke="#22d3ee" stroke-opacity=".25" stroke-dasharray="2 9"/>
      <circle cx="550" cy="205" r="7" fill="#22d3ee"/>
      <circle cx="506" cy="99" r="4" fill="#f472b6"/>
    </g>

    <!-- Core -->
    <circle cx="400" cy="205" r="54" fill="url(#coreGlow)">
      <animate attributeName="opacity" values=".7;1;.7" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="52;58;52" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="205" r="26" fill="url(#coreBody)"/>
    <circle cx="400" cy="205" r="26" fill="none" stroke="#e9d5ff" stroke-opacity=".35"/>
    <circle cx="393" cy="197" r="6" fill="#ffffff" opacity=".28"/>

    <!-- Core label -->
    <text x="400" y="272" text-anchor="middle" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="5">NEBULA</text>

    <!-- Legend -->
    <text x="400" y="408" text-anchor="middle" font-family="'Courier New',monospace" font-size="12"><tspan fill="#a855f7">&#9679;</tspan><tspan fill="#8b949e"> ACADEMIX&#160;&#160;&#160;</tspan><tspan fill="#0ea5e9">&#9679;</tspan><tspan fill="#8b949e"> SAAS PLATFORMS&#160;&#160;&#160;</tspan><tspan fill="#22d3ee">&#9679;</tspan><tspan fill="#8b949e"> WEB APPS&#160;&#160;&#160;</tspan><tspan fill="#f472b6">&#9679;</tspan><tspan fill="#8b949e"> MOBILE</tspan></text>
  </g>
</svg>
