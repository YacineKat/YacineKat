<svg viewBox="0 0 520 180" width="520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nebula build and deploy terminal">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <clipPath id="termClip"><rect width="520" height="180" rx="10"/></clipPath>
  </defs>

  <!-- Window frame -->
  <rect width="520" height="180" rx="10" fill="url(#termBg)" stroke="#292e42" stroke-width="1"/>

  <g clip-path="url(#termClip)">
    <!-- Title bar -->
    <rect width="520" height="34" rx="10" fill="#16161e"/>
    <rect y="24" width="520" height="10" fill="#16161e"/>

    <!-- Traffic lights -->
    <circle cx="22" cy="17" r="5.5" fill="#ff5f57"/>
    <circle cx="42" cy="17" r="5.5" fill="#ffbd2e"/>
    <circle cx="62" cy="17" r="5.5" fill="#28c840"/>

    <!-- Title -->
    <text x="260" y="21" text-anchor="middle" fill="#565f89" font-size="11" font-family="'Courier New',monospace">nebula &#8212; build &amp; deploy</text>

    <!-- Line 1: build nebula -->
    <text x="20" y="64" font-family="'Courier New',monospace" font-size="13">
      <tspan fill="#9ece6a">&#10095;</tspan><tspan fill="#c0caf5"> build nebula</tspan>
    </text>
    <text x="20" y="82" font-family="'Courier New',monospace" font-size="12">
      <tspan fill="#9ece6a">&#10003;</tspan><tspan fill="#565f89"> build completed in 2.4s</tspan>
    </text>

    <!-- Line 2: deploy academix -->
    <text x="20" y="110" font-family="'Courier New',monospace" font-size="13">
      <tspan fill="#9ece6a">&#10095;</tspan><tspan fill="#c0caf5"> deploy academix</tspan>
    </text>
    <text x="20" y="128" font-family="'Courier New',monospace" font-size="12">
      <tspan fill="#9ece6a">&#10003;</tspan><tspan fill="#565f89"> deployed to production</tspan>
    </text>

    <!-- Line 3: ship product + blinking cursor -->
    <text x="20" y="156" font-family="'Courier New',monospace" font-size="13">
      <tspan fill="#9ece6a">&#10095;</tspan><tspan fill="#c0caf5"> ship product</tspan>
      <tspan fill="#c0caf5">&#9612;<animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite"/></tspan>
    </text>

    <!-- Subtle glow behind cursor line -->
    <rect x="16" y="142" width="200" height="18" rx="3" fill="#7c3aed" opacity=".04">
      <animate attributeName="opacity" values=".04;.08;.04" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
