<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 64" width="560" role="img" aria-label="Live status: building Academix">
  <!-- Pill -->
  <rect x="1" y="1" width="558" height="62" rx="31" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Pulsing live dot -->
  <circle cx="36" cy="32" r="6" fill="#3fb950">
    <animate attributeName="r" values="5;11;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".35;0;.35" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="36" cy="32" r="4.5" fill="#3fb950"/>

  <!-- Status text -->
  <text x="60" y="37" font-family="'Courier New',monospace" font-size="12.5"><tspan fill="#3fb950" font-weight="bold" letter-spacing="2">LIVE</tspan><tspan fill="#484f58"> &#183; </tspan><tspan fill="#c9d1d9">Building </tspan><tspan fill="#58a6ff" font-weight="bold">Academix v1.2</tspan><tspan fill="#8b949e"> &#8212; systems online</tspan><tspan fill="#3fb950">&#9612;<animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;.5" dur="1.1s" repeatCount="indefinite"/></tspan></text>
</svg>
